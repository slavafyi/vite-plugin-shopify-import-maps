name: Test

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  test:
    name: Vite ${{ matrix.vite }} / Node 22
    strategy:
      fail-fast: false
      matrix:
        vite: ['5.4.21', '6.4.2', '7.2.7', '8.0.0', '8.1.0', 'locked']
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.x
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Select compatibility version
        if: matrix.vite != 'locked'
        run: pnpm add --save-dev --save-exact vite-compat@npm:vite@${{ matrix.vite }}

      - name: Assert Vite version
        env:
          EXPECTED_VITE: ${{ matrix.vite }}
        run: |
          node -e "const expected = process.env.EXPECTED_VITE; const version = require(expected === 'locked' ? 'vite/package.json' : 'vite-compat/package.json').version; console.log('vite', version); if (expected === 'locked' ? !version.startsWith('8.') : version !== expected) process.exit(1)"

      - name: Run tests
        run: pnpm test

      - name: Run preload build compatibility tests
        if: matrix.vite != 'locked'
        env:
          VITE_TEST_PACKAGE: vite-compat
        run: pnpm exec vitest run tests/preload-build.test.ts

      - name: Run build
        run: pnpm build
